apiVersion: apps/v1
kind: Deployment
metadata:
  name: fte-message-processor
  namespace: customer-success-fte
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fte-message-processor
  template:
    metadata:
      labels:
        app: fte-message-processor
    spec:
      containers:
        - name: worker
          image: customer-success-fte/worker:latest
          envFrom:
            - configMapRef:
                name: fte-config
            - secretRef:
                name: fte-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fte-response-dispatcher
  namespace: customer-success-fte
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fte-response-dispatcher
  template:
    metadata:
      labels:
        app: fte-response-dispatcher
    spec:
      containers:
        - name: dispatcher
          image: customer-success-fte/dispatcher:latest
          envFrom:
            - configMapRef:
                name: fte-config
            - secretRef:
                name: fte-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
