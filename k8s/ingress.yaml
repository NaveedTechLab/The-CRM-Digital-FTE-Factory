apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fte-ingress
  namespace: customer-success-fte
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.customer-success-fte.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fte-api-service
                port:
                  number: 80
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: fte-api-service
                port:
                  number: 80
    - host: app.customer-success-fte.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fte-web-form-service
                port:
                  number: 80
    - host: dashboard.customer-success-fte.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fte-api-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fte-api-service
                port:
                  number: 80
  tls:
    - hosts:
        - api.customer-success-fte.local
        - app.customer-success-fte.local
        - dashboard.customer-success-fte.local
      secretName: fte-tls-secret
