groups:
  - name: fte_api_alerts
    rules:
      - alert: HighResponseLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="fte-api"}[5m])) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API response latency"
          description: "P95 latency is {{ $value }}s (threshold: 3s)"

      - alert: HighErrorRate
        expr: rate(http_requests_total{job="fte-api",status=~"5.."}[5m]) / rate(http_requests_total{job="fte-api"}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: APIDown
        expr: up{job="fte-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FTE API is down"
          description: "API service has been unreachable for more than 1 minute"

  - name: fte_worker_alerts
    rules:
      - alert: WorkerDown
        expr: up{job="fte-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Message processor worker is down"

      - alert: HighMessageProcessingTime
        expr: histogram_quantile(0.95, rate(message_processing_duration_seconds_bucket{job="fte-worker"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow message processing"
          description: "P95 processing time is {{ $value }}s"

      - alert: HighEscalationRate
        expr: rate(tickets_escalated_total[1h]) / rate(tickets_created_total[1h]) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Escalation rate exceeds 25%"
          description: "Current escalation rate: {{ $value | humanizePercentage }}"

  - name: fte_dispatcher_alerts
    rules:
      - alert: DispatcherDown
        expr: up{job="fte-dispatcher"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Response dispatcher is down"

      - alert: DeliveryFailureRate
        expr: rate(response_delivery_failures_total[5m]) / rate(response_delivery_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High delivery failure rate"
          description: "Delivery failure rate: {{ $value | humanizePercentage }}"

      - alert: RateLimitHits
        expr: rate(rate_limit_exceeded_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frequent rate limit hits"
          description: "Rate limit exceeded {{ $value }} times/sec"

  - name: infrastructure_alerts
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL connection count: {{ $value }}"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage above 85%"

      - alert: KafkaDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"

      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka consumer lag"
          description: "Consumer lag is {{ $value }} messages"
