apiVersion: v1
kind: ConfigMap
metadata:
  name: fte-config
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
    environment: production
    platform: azure
data:
  # Application
  APP_NAME: "customer-success-fte"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # Kafka (running in-cluster via Confluent images)
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"

  # Azure Database for PostgreSQL Flexible Server
  # Format: postgresql://<admin>:<password>@<server>.postgres.database.azure.com:5432/crm_db?sslmode=require
  # Actual value injected from azure-secrets via env overlay
  DATABASE_URL: "postgresql://fteadmin@pg-fte-server.postgres.database.azure.com:5432/crm_db?sslmode=require"

  # Azure Cache for Redis (TLS on port 6380)
  # Format: rediss://:<key>@<name>.redis.cache.windows.net:6380/0
  REDIS_URL: "rediss://redis-fte-cache.redis.cache.windows.net:6380/0"

  # Rate limits
  GMAIL_RATE_LIMIT_PER_MINUTE: "250"
  WHATSAPP_RATE_LIMIT_PER_MINUTE: "50"
  WEBFORM_RATE_LIMIT_PER_MINUTE: "1000"
  MAX_RETRY_ATTEMPTS: "3"
  DELIVERY_TIMEOUT_SECONDS: "30"
