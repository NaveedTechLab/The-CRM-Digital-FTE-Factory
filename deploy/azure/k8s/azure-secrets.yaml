apiVersion: v1
kind: Secret
metadata:
  name: fte-secrets
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
    environment: production
    platform: azure
type: Opaque
stringData:
  # ──────────────────────────────────────────────────────────────────────────
  # IMPORTANT: Replace placeholder values before applying.
  #
  # For production, populate from Azure Key Vault:
  #   az keyvault secret show --vault-name kv-fte-secrets --name <secret-name> --query value -o tsv
  #
  # Or use the CSI Secrets Store Driver for automatic injection:
  #   https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
  # ──────────────────────────────────────────────────────────────────────────

  # Azure PostgreSQL (override DATABASE_URL from configmap with password included)
  DATABASE_URL: "postgresql://fteadmin:<PG_PASSWORD>@pg-fte-server.postgres.database.azure.com:5432/crm_db?sslmode=require"
  POSTGRES_PASSWORD: "<PG_PASSWORD>"

  # Azure Redis (override REDIS_URL from configmap with access key)
  REDIS_URL: "rediss://:<REDIS_ACCESS_KEY>@redis-fte-cache.redis.cache.windows.net:6380/0"

  # OpenAI
  OPENAI_API_KEY: "<OPENAI_API_KEY>"

  # Twilio
  TWILIO_ACCOUNT_SID: "<TWILIO_ACCOUNT_SID>"
  TWILIO_AUTH_TOKEN: "<TWILIO_AUTH_TOKEN>"
  TWILIO_WHATSAPP_NUMBER: "whatsapp:+1234567890"

  # Gmail
  GMAIL_SENDER_EMAIL: "<GMAIL_SENDER_EMAIL>"
