[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:dashboard-api]
command=python -m uvicorn main:app --host 127.0.0.1 --port 8002
directory=/app/dashboard-api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",GMAIL_SENDER_EMAIL="%(ENV_GMAIL_SENDER_EMAIL)s",GMAIL_APP_PASSWORD="%(ENV_GMAIL_APP_PASSWORD)s",WHATSAPP_PHONE_NUMBER_ID="%(ENV_WHATSAPP_PHONE_NUMBER_ID)s",WHATSAPP_ACCESS_TOKEN="%(ENV_WHATSAPP_ACCESS_TOKEN)s",WHATSAPP_VERIFY_TOKEN="%(ENV_WHATSAPP_VERIFY_TOKEN)s"

[program:web-form]
command=node_modules/.bin/next start -p 3000
directory=/app/web-form
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
