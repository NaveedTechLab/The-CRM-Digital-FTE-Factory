events {
    worker_connections 1024;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=web:10m rate=200r/m;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Upstream definitions
    upstream api_backend {
        server fte-api:8000;
    }

    upstream dashboard_backend {
        server fte-dashboard:8002;
    }

    upstream webform_backend {
        server fte-web-form:3000;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    # ── Main server (port 80) ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # ── Web Support Form (default) ────────────────────────────────────
        location / {
            limit_req zone=web burst=20 nodelay;
            proxy_pass http://webform_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Ingestion API (Phase 3) ──────────────────────────────────────
        location /ingestion/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Webhooks (WhatsApp, etc.) ─────────────────────────────────────
        location /webhook {
            proxy_pass http://dashboard_backend/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Dashboard API ─────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://dashboard_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Support form submission ───────────────────────────────────────
        location /support/ {
            proxy_pass http://dashboard_backend/support/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Dashboard frontend (Next.js) ─────────────────────────────────
        location /dashboard {
            proxy_pass http://webform_backend/dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Dispatcher API (Phase 5) ─────────────────────────────────────
        location /dispatcher/ {
            proxy_pass http://fte-dispatcher:8001/dispatcher/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Grafana ──────────────────────────────────────────────────────
        location /grafana/ {
            proxy_pass http://grafana_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Prometheus ────────────────────────────────────────────────────
        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Health check ──────────────────────────────────────────────────
        location /health {
            proxy_pass http://dashboard_backend/health;
        }
    }
}
